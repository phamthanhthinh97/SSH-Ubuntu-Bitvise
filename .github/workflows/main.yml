name: SSH-Ubuntu-Bitvise

on:
  workflow_dispatch:

jobs:
  secure-ssh-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Configure SSH and Set Password
        run: |
          # Tạo mật khẩu ngẫu nhiên có độ bảo mật cao
          PASSWORD=$(date +%s | sha256sum | base64 | head -c 16)
          
          # Đặt mật khẩu cho user mặc định 'runner' của GitHub Actions
          echo "runner:$PASSWORD" | sudo chpasswd
          
          # Cho phép đăng nhập SSH bằng mật khẩu (mặc định GitHub tắt tính năng này)
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-enable-password-auth.conf > /dev/null
          sudo sshd -t
          sudo sshd -T | grep -qx 'passwordauthentication yes'
          sudo systemctl restart ssh
          
          # Lưu thông tin mật khẩu vào biến môi trường
          echo "SSH_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install OpenCode and cinematic skill
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          sudo ln -sf "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode
          opencode --version

          mkdir -p /home/runner/project "$HOME/.config/opencode/skills"
          SKILL_REPO=$(mktemp -d)
          trap 'rm -rf "$SKILL_REPO"' EXIT
          git clone --depth 1 https://github.com/Moh4696/cinematic-skill.git "$SKILL_REPO"
          cp -a "$SKILL_REPO/skills/cinematic-film" "$HOME/.config/opencode/skills/"
          test -s "$HOME/.config/opencode/skills/cinematic-film/SKILL.md"

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-ubuntu-ssh-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Không lấy được IP Tailscale. Thoát."
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Connection
        run: |
          echo -e "\n=== BITVISE SSH ACCESS INFORMATION ==="
          echo "Host (IP): $TAILSCALE_IP"
          echo "Port: 22"
          echo "Username: runner"
          echo "Password: $SSH_PASSWORD"
          echo -e "=======================================\n"
          
          while true; do
              echo "[$(date)] SSH Server Active - Đang đợi kết nối..."
              sleep 300
          done

      - name: Upload project film outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-out
          path: /home/runner/project/*/film/out/**
          if-no-files-found: warn
          include-hidden-files: true
